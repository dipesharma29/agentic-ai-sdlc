services:
  fix-agent:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ..:/app                                   # project: agent code + workspace/agent-poc-sandbox
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro # Google credentials (gcloud auth application-default login)
    env_file:
      - ./fix_agent/.env
    environment:
      GIT_AUTHOR_NAME: "AI DLC Fix Agent"
      GIT_AUTHOR_EMAIL: "fix-agent@noreply.local"
      GIT_COMMITTER_NAME: "AI DLC Fix Agent"
      GIT_COMMITTER_EMAIL: "fix-agent@noreply.local"
